services:
    app:
        build: .
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
        depends_on:
            - db

    db:
        image: mysql:8
        environment:
            MYSQL_DATABASE: laravel
            MYSQL_ROOT_PASSWORD: rahasia
        volumes:
            - dbdata:/var/lib/mysql

volumes:
    dbdata:
